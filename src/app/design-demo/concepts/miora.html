<article class="mock">
  <header class="nav">
    <span class="brand">miora</span><span>Формулы ухода</span><span>Коллекция · 03</span>
  </header>
  <section class="product-world">
    <img
      src="images/concept-miora-v2.webp"
      alt="Упаковка авторского концепта miora: янтарный флакон и кремовая баночка в мягком боковом свете"
      width="1536"
      height="1024"
      loading="lazy"
      decoding="async"
    />
    <div class="copy">
      <p>Ежедневный ритуал</p>
      <h3>Меньше.<br /><em>Но лучше.</em></h3>
      <p class="lead">Три средства. Простая последовательность. Время, которое принадлежит вам.</p>
      <span class="shop">Открыть коллекцию <span aria-hidden="true">↗</span></span>
    </div>
    <span class="edition">miora / essential care</span>
  </section>
  <section class="collection">
    @for (item of products; track item.name) {
      <div>
        <span>{{ item.name }}</span
        ><small>{{ item.note }}</small
        ><b>{{ item.price }}</b>
      </div>
    }
  </section>
</article>
