<article class="mock">
  <header class="nav">
    <span class="nav__brand">СДВИГ</span><span>Независимый лейбл / Москва</span
    ><span>Релизы &nbsp; Артисты &nbsp; Журнал</span>
  </header>
  <section class="poster">
    <h3>ЗВУК<br /><span>ВНЕ ПРАВИЛ.</span></h3>
    <div class="record" aria-hidden="true">
      <span>СДВИГ<br />33 RPM</span>
    </div>
    <p>Электроника, экспериментальный хип-хоп и ночные релизы — без жанровых границ.</p>
    <span class="listen">Слушать последние релизы ↗</span>
  </section>
  <section class="releases">
    @for (item of releases; track item.title) {
      <div>
        <span>{{ item.title }}</span
        ><small>{{ item.meta }}</small
        ><b aria-hidden="true">↗</b>
      </div>
    }
  </section>
</article>
