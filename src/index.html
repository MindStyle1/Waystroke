    <script>
      document.documentElement.classList.replace('no-js', 'js');

      // Повторный визит и reduced-motion пропускают декоративное intro.
      (function () {
        var root = document.documentElement;

        if (/[?&]preview=loader(?:&|$)/.test(window.location.search)) {
          root.dataset.bootState = 'review';
          root.classList.add('boot-review');
          // Служебный кадр не должен попасть в индекс.
          var meta = document.createElement('meta');
          meta.name = 'robots';
          meta.content = 'noindex, nofollow';
          document.head.appendChild(meta);
          return;
        }

        try {
          if (window.sessionStorage.getItem('waystroke:booted')) {
            root.dataset.bootState = 'off';
            root.classList.add('boot-skip');
            return;
          }
        } catch (err) {
          // Хранилище может быть недоступно (приватный режим, отключённые
          // куки). Тогда загрузчик просто покажется — он уходит по таймеру.
        }

        var reduced =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          root.dataset.bootState = 'off';
          root.classList.add('boot-skip');
        }
      })();
    </script>

    <!-- Cloudflare Web Analytics. Тот же токен, что раньше вставлял сам
         Cloudflare Pages: раз сайт теперь раздаёт GitHub Pages, скрипт

    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "b2ae0ed2f1cc463da32cdc5583300451"}'
    ></script>
  </head>
  <body>
    <!--
      Брендовый intro «первый штрих». Разметка лежит в документе,
      а сцена запускается после готовности Angular.

      Intro — декоративный слой: не скрывает контент и не блокирует управление.

      Устройство кадра: точка — начало штриха, а не украшение рядом с ним;
      штрих — одна непрерывная линия с пологим подъёмом и коротким заносом в
      конце; «WAYSTROKE» лежит в `<g>` под маской, а по маске идёт та же
      линия, но намного толще, — так слово проявляется ровно там, где прошёл
      штрих, а сами буквы разрывают эту линию. Точка нарисована после
      маскированной группы и закрывает начало штриха.
    -->
    <div class="boot" data-boot>

      <div class="boot__scene">
        <svg
          class="boot__svg"
          viewBox="0 0 360 116"
          width="360"
          height="116"
          aria-hidden="true"
          focusable="false"
        >
          <defs>
            <mask
              id="boot-reveal"
              maskUnits="userSpaceOnUse"
              x="-20"
              y="-20"
              width="400"
              height="160"
            >
              <path
                class="boot__sweep"
                d="M16 94C44 90 62 88 84 86C108 83 126 81 148 78C172 75 194 71 216 68C238 65 258 63 278 62C300 61 320 46 340 16"
                pathLength="1"
                fill="none"
                stroke="#fff"
                stroke-width="42"
                stroke-linecap="round"
              />
            </mask>
          </defs>

          <g mask="url(#boot-reveal)">
            <path
              class="boot__line"
              d="M16 94C44 90 62 88 84 86C108 83 126 81 148 78C172 75 194 71 216 68C238 65 258 63 278 62C300 61 320 46 340 16"
              pathLength="1"
              fill="none"
              stroke-linecap="round"
            />
            <text
              class="boot__word"
              x="171"
              y="84"
              text-anchor="middle"
              textLength="196"
              lengthAdjust="spacing"
            >
              WAYSTROKE
            </text>
          </g>

          <circle class="boot__dot" cx="16" cy="94" r="4.6" />
        </svg>
      </div>

      <button class="boot__replay" type="button" data-boot-replay hidden>Повторить штрих</button>
    </div>

    <app-root></app-root>

    <!-- The optional font stylesheet is added to the prerendered head at build time.
         It loads before the concept artwork enters view; the hero keeps its own faces. -->
    <script>
      (function () {
        var sheet = document.getElementById('concept-fonts');
        var section = document.getElementById('design');
        if (!sheet || !section) return;

        // Reserve the prerendered comparison frame while its first pair's faces load.
        // With JavaScript disabled this class is never added and the artwork stays visible.
        document.documentElement.classList.add('concept-fonts-pending');

        var observer;
        function activate() {
          if (sheet.media === 'all') return;
          sheet.media = 'all';
          document.dispatchEvent(new Event('concept-fonts-activated'));
          observer && observer.disconnect();
          document.removeEventListener('click', onNavigation, true);
        }
        function onNavigation(event) {
          if (event.target.closest('[data-scroll-to="design"]')) activate();
        }

        document.addEventListener('click', onNavigation, true);
        if (!('IntersectionObserver' in window)) {
          activate();
          return;
        }
        observer = new IntersectionObserver(function (entries) {
          if (entries.some(function (entry) { return entry.isIntersecting; })) activate();
        }, { rootMargin: '80px 0px' });
        observer.observe(section);
      })();
    </script>

    <!-- Intro стартует после готовности интерфейса. Его таймеры управляют
         только сценой; Angular, прокрутка и фокус от них не зависят. -->
    <script>
      (function () {
        var root = document.documentElement;
        // И класс, и признак: одиночного признака мало, его имя может повториться
        // на документе (см. data-boot-state выше).
        var boot = document.querySelector('.boot[data-boot]');
        var review = root.classList.contains('boot-review');
        var timers = [];
        var released = false;
        var started = false;

        function later(fn, ms) {
          timers.push(window.setTimeout(fn, ms));
        }

        function stopTimers() {
          timers.forEach(function (id) {
            window.clearTimeout(id);
          });
          timers = [];
        }

        /* Завершает только декоративную сцену. */
        function release() {
          if (released) return;
          released = true;
          stopTimers();
          window.removeEventListener('waystroke:app-ready', start);
          root.dataset.bootState = 'off';
          // Событие оставлено для совместимости; приложение его не ждёт.
          window.dispatchEvent(new CustomEvent('waystroke:boot-done'));

          // В режиме просмотра кадр остаётся на экране — его снимает повтор.
          if (review) return;

          try {
            window.sessionStorage.setItem('waystroke:booted', '1');
          } catch (err) {
            // Хранилище недоступно: следующий визит покажет загрузчик снова.
          }

          boot.classList.add('is-out');
          later(function () {
            boot.hidden = true;
          }, 640);
        }

        /*
         * Пропуск: загрузчик не показывался (решение принято в `<head>`, кадр
         * скрыт стилями с первой отрисовки), поэтому здесь он просто удаляется.
         * Показывать и тут же убирать через скрипт нельзя: это тот самый кадр
         * без анимации, ради которого всё затевалось.
         */
        if (!boot || root.classList.contains('boot-skip')) {
          if (boot) boot.remove();
          root.dataset.bootState = 'off';
          window.dispatchEvent(new CustomEvent('waystroke:boot-done'));
          return;
        }

        root.dataset.bootState = 'on';

        var replay = boot.querySelector('[data-boot-replay]');
        if (replay) {
          replay.addEventListener('click', function () {
            // Сцены на элементе четыре, и все они уже отыграли: возвращаем их
            // в начало и продолжаем играть, не пересобирая разметку.
            boot.getAnimations({ subtree: true }).forEach(function (step) {
              step.currentTime = 0;
              step.play();
            });
          });
          // Кнопка повтора — только для просмотра сцены, в обычной загрузке
          // её на экране быть не должно.
          replay.hidden = !review;
        }

        function start() {
          if (started || released) return;
          started = true;
          window.removeEventListener('waystroke:app-ready', start);
          window.requestAnimationFrame(function () {
            if (released) return;
            boot.classList.add('is-playing');
            later(release, 1560);
          });
        }

        window.addEventListener('waystroke:app-ready', start, { once: true });
        if (review) start();

        // При ошибке bootstrap убираем сцену без блокировки страницы.
        later(release, 4600);
      })();
    </script>
  </body>
