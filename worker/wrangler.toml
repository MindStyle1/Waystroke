# Справочная конфигурация Worker'а приёма конверсий.
#
# Лежит в репозитории для воспроизводимости, но сборку сайта не затрагивает:
# Angular берёт только src/ и public/, а Pages читает wrangler.toml лишь из
# корня репозитория — здесь он на два уровня ниже.
#
# Деплой (нужен токен с Workers Scripts:Edit):
#   npx wrangler deploy --config worker/wrangler.toml
#
# Адрес Worker'а — собственный поддомен, а не путь на сайте.
#
# Так пришлось сделать после переезда сайта с Cloudflare Pages на GitHub
# Pages: маршрут `waystroke.online/api/*` работал только на проксированном
# трафике, а apex теперь отдаётся напрямую с IP GitHub (серое облако) и до
# Cloudflare не доходит вовсе. Отдельное имя Worker'а живёт на прокси и
# потому остаётся доступным; события с сайта приходят на него «через»
# домен, поэтому в track.js добавлены CORS-заголовки и ответ на preflight.
#
# Секрет STATS_TOKEN ставится один раз и в репозиторий не попадает:
#   npx wrangler secret put STATS_TOKEN --config worker/wrangler.toml
#   # или через API: PUT /accounts/{id}/workers/scripts/waystroke-track/secrets
#
# Адрес страницы:  https://track.waystroke.online/api/stats?key=<STATS_TOKEN>
# Данные для неё:  https://track.waystroke.online/api/stats.json (тот же ключ)
#
# Схема таблицы (создаётся один раз):
#   CREATE TABLE IF NOT EXISTS conversions (
#     day    TEXT    NOT NULL,
#     event  TEXT    NOT NULL,
#     source TEXT    NOT NULL,
#     count  INTEGER NOT NULL DEFAULT 0,
#     PRIMARY KEY (day, event, source)
#   );

name = "waystroke-track"
main = "track.js"
compatibility_date = "2026-09-26"

[[d1_databases]]
binding = "DB"
database_name = "waystroke-events"
database_id = "6b6411a9-745f-4207-8403-bac0850ff72e"

# Собственное имя Worker'а: Cloudflare сам создаёт под него сертификат и
# запись DNS, поэтому сайт и Worker больше не зависят от одной записи.
routes = [{ pattern = "track.waystroke.online", custom_domain = true }]
